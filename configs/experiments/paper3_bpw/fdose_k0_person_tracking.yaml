# FDose L1 — arm `k0`（person_tracking）：参考剂量臂（自计划，γ=0）：K_i = 本事件 |ref_sel|，即基础标量规则的选点数。它是**计划源**，也是剂量参考。
#
# 预注册：paper3/results/evidence/prereg_fdose_2026-10-31.md（判据看数据前锁定）
# 三臂只差两处：gamma 与 dose_plan_path。k0 自计划 ⇒ 它就是计划源；
# G/S 消费同一份冻结计划（sha256 记在 plan 文件里），逐事件取恰好 K_i 个点。
# 剂量因此**外生**：不依赖本臂自己长成什么样（CGB 的失效模式正相反）。
inherit_from: "configs/rgbd/bonn/person_tracking.yaml"
method_from: "configs/experiments/combined_prune/method.yaml"
method: "Combined-Prune"

rng_sequence: "person_tracking"

SelectiveDensification:
  enabled: true
  signal: "frozen_dose"
  gamma: 0.0
  tau_low_factor: 0.5
  sparsity_k: 6
  dose_plan_path: null         # 自计划（臂内 |ref_sel|）
  trace_selection: true
  log_every: 10

Results:
  save_dir: "results/paper3_bpw/fdose_k0_person_tracking"
  save_per_frame_ape: true
