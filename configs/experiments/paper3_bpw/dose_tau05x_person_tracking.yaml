# 剂量-响应筛查（P3-D2-018 / prereg_dose_response_2026-11-04）：τ_scale=0.5
# 唯一变量 = opt_params.densify_grad_threshold（基线 0.0002 × 0.5）；其余与 maskstat_off 同链。
inherit_from: "configs/rgbd/bonn/person_tracking.yaml"
method_from: "configs/experiments/combined_prune/method.yaml"
method: "Combined-Prune"

rng_sequence: "person_tracking"

SelectiveDensification:
  enabled: false

opt_params:
  densify_grad_threshold: 0.0001

Results:
  save_dir: "results/paper3_bpw/dose_tau05x_person_tracking"
  save_per_frame_ape: true
